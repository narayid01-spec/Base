
name: Build Zena Bug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Zena Bug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Source ZIP
        shell: bash
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/zena-unpack"
          count=0

          while IFS= read -r -d '' archive; do
            count=$((count + 1))
            dest="$RUNNER_TEMP/zena-unpack/source_$count"
            mkdir -p "$dest"
            unzip -oq "$archive" -d "$dest"
          done < <(
            find "$GITHUB_WORKSPACE" \
              -maxdepth 2 -type f -iname '*.zip' \
              -not -path '*/.git/*' -print0
          )

      - name: Locate Flutter Project
        id: locate
        shell: bash
        run: |
          set -e
          PROJECT_FILE=""

          for root in \
            "$RUNNER_TEMP/zena-unpack" \
            "$GITHUB_WORKSPACE"; do
            [ -d "$root" ] || continue

            PROJECT_FILE=$(find "$root" \
              -type f -name pubspec.yaml \
              -not -path '*/.git/*' \
              -not -path '*/.dart_tool/*' \
              -not -path '*/build/*' \
              -print -quit)

            if [ -n "$PROJECT_FILE" ]; then
              break
            fi
          done

          if [ -z "$PROJECT_FILE" ]; then
            echo "::error::pubspec.yaml tidak ditemui."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"

          if [ ! -f "$PROJECT_DIR/lib/main.dart" ]; then
            echo "::error::lib/main.dart tidak ditemui."
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Copy Source
        env:
          SOURCE_DIR: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/zena-build"
          cp -a "$SOURCE_DIR/." "$RUNNER_TEMP/zena-build/"
          rm -rf "$RUNNER_TEMP/zena-build/.dart_tool"
          rm -rf "$RUNNER_TEMP/zena-build/build"
          echo "ZENA_BUILD_DIR=$RUNNER_TEMP/zena-build" >> "$GITHUB_ENV"

      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set Up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses

      - name: Prepare Android Project
        working-directory: ${{ env.ZENA_BUILD_DIR }}
        shell: bash
        run: |
          set -e

          if [ ! -f android/app/build.gradle ] && \
             [ ! -f android/app/build.gradle.kts ]; then
            rm -rf android
            flutter create \
              --platforms=android \
              --project-name zena_bug .
          fi

          test -f pubspec.yaml
          test -f lib/main.dart

      - name: Set Android Compile SDK 36
        working-directory: ${{ env.ZENA_BUILD_DIR }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          files = [
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts"),
          ]

          target = next((p for p in files if p.is_file()), None)

          if target is None:
              sys.exit("Android app Gradle file not found.")

          source = target.read_text()

          patterns = [
              r'compileSdkVersion\s*(?:=\s*)?\d+',
              r'compileSdkVersion\s+flutter\.compileSdkVersion',
              r'compileSdk\s*=\s*\d+',
              r'compileSdk\s+flutter\.compileSdkVersion',
          ]

          updated = source
          for pattern in patterns:
              updated = re.sub(pattern, 'compileSdk = 36', updated)

          if updated == source:
              print("Could not find a known compileSdk declaration.")
              print("Gradle file:", target)
              print(source)
              sys.exit(1)

          target.write_text(updated)
          print("Updated compileSdk to 36 in", target)
          PY

          grep -n 'compileSdk' android/app/build.gradle \
            android/app/build.gradle.kts 2>/dev/null || true

      - name: Clean Project
        working-directory: ${{ env.ZENA_BUILD_DIR }}
        run: flutter clean

      - name: Get Dependencies
        working-directory: ${{ env.ZENA_BUILD_DIR }}
        run: flutter pub get

      - name: Analyze Dart
        working-directory: ${{ env.ZENA_BUILD_DIR }}
        run: flutter analyze
        continue-on-error: true

      - name: Run Flutter Tests
        working-directory: ${{ env.ZENA_BUILD_DIR }}
        shell: bash
        run: |
          if [ -d test ] && \
             find test -type f -name '*_test.dart' -print -quit | grep -q .; then
            flutter test
          else
            echo "No Dart tests found; skipping."
          fi
        continue-on-error: true

      - name: Build Release APK
        working-directory: ${{ env.ZENA_BUILD_DIR }}
        run: flutter build apk --release

      - name: Verify APK
        working-directory: ${{ env.ZENA_BUILD_DIR }}
        run: |
          set -e
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/Zena Bug.apk"
          ls -lh "$GITHUB_WORKSPACE/Zena Bug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zena Bug
          path: "Zena Bug.apk"
          if-no-files-found: error
          retention-days: 14
