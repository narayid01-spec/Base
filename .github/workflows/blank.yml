
name: Build Zena Bug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Zena Bug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract ZIP Source
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/zena-source"

          while IFS= read -r -d '' archive; do
            dest="$RUNNER_TEMP/zena-source/$(basename "$archive" .zip)"
            mkdir -p "$dest"
            unzip -oq "$archive" -d "$dest"
          done < <(
            find "$GITHUB_WORKSPACE" \
              -maxdepth 2 -type f -name '*.zip' \
              -not -path '*/.git/*' -print0
          )

      - name: Locate Latest Flutter Source
        id: locate
        shell: bash
        run: |
          ROOT="$RUNNER_TEMP/zena-source"

          PROJECT_FILE=$(find "$ROOT" \
            -type f -name pubspec.yaml \
            -not -path '*/.dart_tool/*' \
            -not -path '*/build/*' \
            -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            PROJECT_FILE=$(find "$GITHUB_WORKSPACE" \
              -type f -name pubspec.yaml \
              -not -path '*/.git/*' \
              -not -path '*/.dart_tool/*' \
              -not -path '*/build/*' \
              -print -quit)
          fi

          if [ -z "$PROJECT_FILE" ]; then
            echo "::error::Tiada projek Flutter ditemui."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"

          if [ ! -f "$PROJECT_DIR/lib/main.dart" ]; then
            echo "::error::lib/main.dart tiada."
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "Selected source: $PROJECT_DIR"
          grep -n -A8 -B3 'subdomains' "$PROJECT_DIR/lib/main.dart" || true

      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Clean Flutter Cache
        run: |
          flutter --version
          dart pub cache repair

      - name: Patch Record Dependency
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("pubspec.yaml")
          s = p.read_text()

          if "dependency_overrides:" not in s:
              s += "\ndependency_overrides:\n  record_linux: ^1.2.1\n"
          elif "record_linux:" not in s:
              s += "\n  record_linux: ^1.2.1\n"

          p.write_text(s)
          print("Configured record_linux override.")
          PY

      - name: Clean Project
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          flutter clean
          rm -rf .dart_tool build
          rm -f pubspec.lock

      - name: Resolve Dependencies
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: flutter pub get

      - name: Verify Resolved Record Packages
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: flutter pub deps

      - name: Analyze Dart
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: flutter analyze
        continue-on-error: true

      - name: Build Release APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: flutter build apk --release

      - name: Verify APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/Zena Bug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zena Bug
          path: "Zena Bug.apk"
          if-no-files-found: error
          retention-days: 14
