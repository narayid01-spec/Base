
name: Build VEdit Pro APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract VEdit Pro project
        run: |
          unzip -o VEditPro-Android.zip -d extracted
          cp -r extracted/. ./ 
          rm -rf extracted

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VEditPro-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
