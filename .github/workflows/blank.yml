
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

jobs:
  build-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Godot version
        run: godot --version

      - name: Import project resources
        run: godot --headless --editor --path . --quit

      - name: Export debug APK
        run: |
          mkdir -p build
          godot --headless --path . \
            --export-debug "Android" \
            build/MegaPropertyTycoon3D.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MegaPropertyTycoon3D-Android-APK
          path: build/MegaPropertyTycoon3D.apk
          if-no-files-found: error
          retention-days: 14
