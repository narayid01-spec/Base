
name: VEdit Pro APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build VEdit Pro APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract VEdit Pro project
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$GITHUB_WORKSPACE/VEditPro-Android-v4-audit-fixed.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: ZIP tidak dijumpai di root repository."
            ls -la "$GITHUB_WORKSPACE"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/extracted"
          unzip -oq "$ZIP" -d "$GITHUB_WORKSPACE/extracted"

          SETTINGS=$(find "$GITHUB_WORKSPACE/extracted" \
            -name settings.gradle.kts -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle.kts tidak dijumpai."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle.kts tidak dijumpai."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projek ditemui: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Discover Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="/usr/local/lib/android/sdk"

          if [ ! -d "$SDK_ROOT" ]; then
            echo "ERROR: Android SDK tidak ditemui di $SDK_ROOT"
            exit 1
          fi

          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" \
            -type f -name sdkmanager -print -quit 2>/dev/null || true)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager tidak dijumpai."
            find "$SDK_ROOT" -maxdepth 5 -type f \
              -name sdkmanager -print
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo "Android SDK ditemui."
          "$SDKMANAGER" --version

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail

          echo "Menerima lesen Android SDK..."

          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          LICENSE_STATUS=$?
          set -o pipefail

          if [ "$LICENSE_STATUS" -ne 0 ]; then
            echo "ERROR: Lesen Android SDK gagal diterima."
            exit 1
          fi

          echo "Proses penerimaan lesen selesai."

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

          echo "Komponen Android SDK sedia."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Find generated APK
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak dijumpai selepas build."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          cp "$APK" "$GITHUB_WORKSPACE/apk-output/VEditPro-debug.apk"

          echo "APK berjaya dihasilkan."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VEditPro-debug-apk
          path: apk-output/VEditPro-debug.apk
          if-no-files-found: error
          retention-days: 7
