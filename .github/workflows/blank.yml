
name: Build Zena Bug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Zena Bug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract ZIP Source
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/zena-source"

          while IFS= read -r -d '' archive; do
            dest="$RUNNER_TEMP/zena-source/$(basename "$archive" .zip)"
            mkdir -p "$dest"
            unzip -oq "$archive" -d "$dest"
          done < <(
            find "$GITHUB_WORKSPACE" \
              -maxdepth 2 -type f -name '*.zip' \
              -not -path '*/.git/*' -print0
          )

      - name: Locate Flutter Project
        id: locate
        shell: bash
        run: |
          PROJECT_FILE=""

          for root in \
            "$RUNNER_TEMP/zena-source" \
            "$GITHUB_WORKSPACE"; do

            [ -d "$root" ] || continue

            PROJECT_FILE=$(find "$root" \
              -type f -name pubspec.yaml \
              -not -path '*/.git/*' \
              -not -path '*/.dart_tool/*' \
              -not -path '*/build/*' \
              -print -quit)

            if [ -n "$PROJECT_FILE" ]; then
              break
            fi
          done

          if [ -z "$PROJECT_FILE" ]; then
            echo "::error::pubspec.yaml tidak ditemui."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"

          if [ ! -f "$PROJECT_DIR/lib/main.dart" ]; then
            echo "::error::lib/main.dart tidak ditemui."
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project: $PROJECT_DIR"

      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Repair Android Configuration
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          if [ ! -f android/app/build.gradle ] && \
             [ ! -f android/app/build.gradle.kts ]; then

            echo "Android Gradle configuration is incomplete."
            echo "Generating fresh Flutter Android scaffolding."

            rm -rf android

            flutter create \
              --platforms=android \
              --project-name zena_bug .
          fi

          if [ ! -f android/app/build.gradle ] && \
             [ ! -f android/app/build.gradle.kts ]; then
            echo "::error::Android Gradle files could not be generated."
            exit 1
          fi

      - name: Clean Flutter Project
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: flutter clean

      - name: Resolve Dependencies
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: flutter pub get

      - name: Analyze Dart
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: flutter analyze
        continue-on-error: true

      - name: Run Flutter Tests
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          if [ -d test ] && \
             find test -type f -name '*_test.dart' -print -quit | grep -q .; then
            flutter test
          else
            echo "No Dart tests found; skipping."
          fi
        continue-on-error: true

      - name: Build Release APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: flutter build apk --release

      - name: Verify and Rename APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/Zena Bug.apk"
          ls -lh "$GITHUB_WORKSPACE/Zena Bug.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zena Bug
          path: "Zena Bug.apk"
          if-no-files-found: error
          retention-days: 14
