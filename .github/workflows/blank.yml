
name: Build Zena Bug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Zena Bug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Source ZIP
        shell: bash
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/zena-unpack"
          count=0

          while IFS= read -r -d '' archive; do
            count=$((count + 1))
            dest="$RUNNER_TEMP/zena-unpack/source_$count"
            mkdir -p "$dest"
            unzip -oq "$archive" -d "$dest"
          done < <(
            find "$GITHUB_WORKSPACE" \
              -maxdepth 2 -type f -iname '*.zip' \
              -not -path '*/.git/*' -print0
          )

      - name: Locate Flutter Project
        id: locate
        shell: bash
        run: |
          set -e
          PROJECT_FILE=""

          for root in \
            "$RUNNER_TEMP/zena-unpack" \
            "$GITHUB_WORKSPACE"; do
            [ -d "$root" ] || continue

            PROJECT_FILE=$(find "$root" \
              -type f -name pubspec.yaml \
              -not -path '*/.git/*' \
              -not -path '*/.dart_tool/*' \
              -not -path '*/build/*' \
              -print -quit)

            if [ -n "$PROJECT_FILE" ]; then
              break
            fi
          done

          if [ -z "$PROJECT_FILE" ]; then
            echo "::error::Projek Flutter tidak ditemui."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"

          if [ ! -f "$PROJECT_DIR/lib/main.dart" ]; then
            echo "::error::lib/main.dart tidak ditemui."
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Copy Flutter Source
        env:
          SOURCE_DIR: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -e
          BUILD_DIR="$RUNNER_TEMP/zena_build"
          mkdir -p "$BUILD_DIR"
          cp -a "$SOURCE_DIR/." "$BUILD_DIR/"
          rm -rf "$BUILD_DIR/.dart_tool" "$BUILD_DIR/build"
          echo "ZENA_BUILD_DIR=$BUILD_DIR" >> "$GITHUB_ENV"

      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Android SDK Packages
        shell: bash
        run: |
          set -e

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "::error::Android SDK tidak ditemui pada runner."
            exit 1
          fi

          SDKMANAGER=$(find "$SDK/cmdline-tools" \
            -type f -name sdkmanager \
            -path '*/bin/sdkmanager' -print -quit)

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager tidak ditemui."
            exit 1
          fi

          echo "Using SDK manager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Prepare Android Project
        working-directory: ${{ env.ZENA_BUILD_DIR }}
        shell: bash
        run: |
          set -e

          if [ ! -f android/app/build.gradle ] && \
             [ ! -f android/app/build.gradle.kts ]; then
            rm -rf android
            flutter create \
              --platforms=android \
              --project-name zena_bug .
          fi

          test -f pubspec.yaml
          test -f lib/main.dart

      - name: Set Compile SDK 36
        working-directory: ${{ env.ZENA_BUILD_DIR }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          candidates = [
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts"),
          ]
          gradle = next((p for p in candidates if p.is_file()), None)

          if gradle is None:
              sys.exit("Android app Gradle file not found.")

          source = gradle.read_text()
          patterns = [
              r'\bcompileSdkVersion\s+flutter\.compileSdkVersion',
              r'\bcompileSdkVersion\s+\d+',
              r'\bcompileSdk\s*=\s*flutter\.compileSdkVersion',
              r'\bcompileSdk\s*=\s*\d+',
              r'\bcompileSdk\s+flutter\.compileSdkVersion',
              r'\bcompileSdk\s+\d+',
          ]

          updated = source
          for pattern in patterns:
              updated, count = re.subn(pattern, 'compileSdk = 36', updated)
              if count:
                  break

          if updated == source:
              sys.exit("Could not update compileSdk automatically.")

          gradle.write_text(updated)
          print(f"Updated {gradle} to compileSdk 36")
          PY

      - name: Clean Project
        working-directory: ${{ env.ZENA_BUILD_DIR }}
        run: flutter clean

      - name: Get Dependencies
        working-directory: ${{ env.ZENA_BUILD_DIR }}
        run: flutter pub get

      - name: Analyze Dart
        working-directory: ${{ env.ZENA_BUILD_DIR }}
        run: flutter analyze
        continue-on-error: true

      - name: Run Flutter Tests
        working-directory: ${{ env.ZENA_BUILD_DIR }}
        shell: bash
        run: |
          if [ -d test ] && \
             find test -type f -name '*_test.dart' -print -quit | grep -q .; then
            flutter test
          else
            echo "No Dart tests found; skipping."
          fi
        continue-on-error: true

      - name: Build Release APK
        working-directory: ${{ env.ZENA_BUILD_DIR }}
        run: flutter build apk --release

      - name: Verify APK
        working-directory: ${{ env.ZENA_BUILD_DIR }}
        shell: bash
        run: |
          set -e
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/Zena Bug.apk"
          ls -lh "$GITHUB_WORKSPACE/Zena Bug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zena Bug
          path: "Zena Bug.apk"
          if-no-files-found: error
          retention-days: 14
