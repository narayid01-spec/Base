
name: Build Zena Bug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Flutter Project
        shell: bash
        run: |
          if [ ! -f pubspec.yaml ]; then
            echo "::error::pubspec.yaml tidak ditemui di root repository."
            echo "Upload projek sumber Flutter lengkap, bukan APK sahaja."
            exit 1
          fi

          if [ ! -d lib ]; then
            echo "::error::Folder lib/ tidak ditemui."
            exit 1
          fi

          if [ ! -f lib/main.dart ]; then
            echo "::error::Fail lib/main.dart tidak ditemui."
            exit 1
          fi

      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter Version
        run: flutter --version

      - name: Check Android Project
        shell: bash
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name zena_bug .
          fi

          if [ ! -f android/app/build.gradle ] &&
             [ ! -f android/app/build.gradle.kts ]; then
            echo "::error::Konfigurasi Gradle Android tidak ditemui."
            exit 1
          fi

      - name: Get Dependencies
        run: flutter pub get

      - name: Analyze Dart
        run: flutter analyze
        continue-on-error: true

      - name: Run Flutter Tests
        shell: bash
        run: |
          if [ -d test ] && find test -name '*_test.dart' -print -quit | grep -q .; then
            flutter test
          else
            echo "Tiada ujian Dart ditemui; langkah ujian dilangkau."
          fi

      - name: Build Release APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "Zena Bug.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zena Bug
          path: "Zena Bug.apk"
          if-no-files-found: error
          retention-days: 14
