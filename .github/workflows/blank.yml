
name: Build Zena Bug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Zena Bug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Uploaded ZIP Files
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/zena_extract"

          while IFS= read -r -d '' file; do
            echo "Checking archive: $file"
            destination="$RUNNER_TEMP/zena_extract/$(basename "$file" .zip)"
            mkdir -p "$destination"

            if ! unzip -oq "$file" -d "$destination"; then
              echo "::warning::Could not extract $file"
            fi
          done < <(find . -type f -name '*.zip' \
            -not -path './.git/*' -print0)

      - name: Locate Flutter Project
        id: locate
        shell: bash
        run: |
          PROJECT_FILE=""

          for root in "$GITHUB_WORKSPACE" "$RUNNER_TEMP/zena_extract"; do
            [ -d "$root" ] || continue

            PROJECT_FILE=$(find "$root" \
              -type f -name pubspec.yaml \
              -not -path '*/.git/*' \
              -not -path '*/build/*' \
              -print -quit)

            if [ -n "$PROJECT_FILE" ]; then
              break
            fi
          done

          if [ -z "$PROJECT_FILE" ]; then
            echo "::error::Tiada pubspec.yaml ditemui, termasuk dalam ZIP."
            echo "Fail APK sahaja tidak mengandungi kod sumber Flutter."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"

          if [ ! -f "$PROJECT_DIR/lib/main.dart" ]; then
            echo "::error::lib/main.dart tiada dalam projek Flutter."
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found Flutter project: $PROJECT_DIR"

      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android Project
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name zena_bug .
          fi

      - name: Get Dependencies
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: flutter pub get

      - name: Analyze Dart
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: flutter analyze
        continue-on-error: true

      - name: Run Tests
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          if [ -d test ] && find test -name '*_test.dart' -print -quit | grep -q .; then
            flutter test
          else
            echo "No Dart tests found; skipping."
          fi

      - name: Build APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: flutter build apk --release

      - name: Prepare Artifact
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
            "$GITHUB_WORKSPACE/Zena Bug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zena Bug
          path: "Zena Bug.apk"
          if-no-files-found: error
          retention-days: 14
