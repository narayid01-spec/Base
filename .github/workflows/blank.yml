
name: Build VEdit Pro v1.1 - Audited

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compile VEdit Pro APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract audited project
        run: |
          if [ ! -f settings.gradle.kts ]; then
            if [ -f VEditPro-Android-v4-audit-fixed.zip ]; then
              unzip -o VEditPro-Android-v4-audit-fixed.zip -d extracted
              cp -R extracted/. .
            elif [ -f VEditPro-Android-v2.zip ]; then
              unzip -o VEditPro-Android-v2.zip -d extracted
              cp -R extracted/. .
            else
              echo "ERROR: Project ZIP not found."
              exit 1
            fi
          fi

          if [ ! -f app/build.gradle.kts ]; then
            echo "ERROR: Android app module not found."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile debug APK
        run: gradle assembleDebug

      - name: Verify APK exists
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload VEdit Pro APK
        uses: actions/upload-artifact@v4
        with:
          name: VEditPro-v1.1-audited-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
