
name: VEdit Pro APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build New VEdit Pro
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and extract new VEdit Pro
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$GITHUB_WORKSPACE/VEdit Pro.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: VEdit Pro.zip tidak dijumpai."
            echo "Muat naik ZIP baharu ke root repository."
            echo "Fail yang tersedia:"
            find "$GITHUB_WORKSPACE" -maxdepth 2 -type f
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/extracted"
          unzip -oq "$ZIP" -d "$GITHUB_WORKSPACE/extracted"

          SETTINGS=$(find "$GITHUB_WORKSPACE/extracted" \
            -name settings.gradle.kts -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle.kts tiada dalam ZIP baharu."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle.kts tiada."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Menggunakan projek baharu: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build VEdit Pro APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: Build selesai tetapi APK tidak ditemui."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          cp "$APK" "$GITHUB_WORKSPACE/apk-output/VEditPro-debug.apk"

          echo "APK berjaya dihasilkan: VEditPro-debug.apk"

      - name: Upload VEdit Pro APK
        uses: actions/upload-artifact@v4
        with:
          name: VEditPro-debug-apk
          path: apk-output/VEditPro-debug.apk
          if-no-files-found: error
          retention-days: 7
