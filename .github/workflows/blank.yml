
name: Build Zena Bug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Zena Bug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Source ZIP
        shell: bash
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/zena-unpack"

          count=0
          while IFS= read -r -d '' archive; do
            count=$((count + 1))
            dest="$RUNNER_TEMP/zena-unpack/source_$count"
            mkdir -p "$dest"
            echo "Extracting source archive $count"

            unzip -oq "$archive" -d "$dest"
          done < <(
            find "$GITHUB_WORKSPACE" \
              -maxdepth 2 -type f -iname '*.zip' \
              -not -path '*/.git/*' -print0
          )

      - name: Locate Flutter Source
        id: locate
        shell: bash
        run: |
          set -e
          PROJECT_FILE=""

          for root in \
            "$RUNNER_TEMP/zena-unpack" \
            "$GITHUB_WORKSPACE"; do

            [ -d "$root" ] || continue

            PROJECT_FILE=$(find "$root" \
              -type f -name pubspec.yaml \
              -not -path '*/.git/*' \
              -not -path '*/.dart_tool/*' \
              -not -path '*/build/*' \
              -print -quit)

            if [ -n "$PROJECT_FILE" ]; then
              break
            fi
          done

          if [ -z "$PROJECT_FILE" ]; then
            echo "::error::Projek Flutter tidak ditemui."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"

          if [ ! -f "$PROJECT_DIR/lib/main.dart" ]; then
            echo "::error::lib/main.dart tidak ditemui."
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Flutter source found."

      - name: Copy to Clean Build Path
        shell: bash
        env:
          SOURCE_DIR: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -e
          BUILD_DIR="$RUNNER_TEMP/zena_build"

          mkdir -p "$BUILD_DIR"
          cp -a "$SOURCE_DIR/." "$BUILD_DIR/"

          rm -rf "$BUILD_DIR/.dart_tool"
          rm -rf "$BUILD_DIR/build"

          echo "ZENA_BUILD_DIR=$BUILD_DIR" >> "$GITHUB_ENV"

      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Tool Versions
        run: |
          flutter --version
          java -version

      - name: Prepare Android Configuration
        working-directory: ${{ env.ZENA_BUILD_DIR }}
        shell: bash
        run: |
          set -e

          if [ ! -f android/app/build.gradle ] && \
             [ ! -f android/app/build.gradle.kts ]; then
            rm -rf android
            flutter create \
              --platforms=android \
              --project-name zena_bug .
          fi

          test -f pubspec.yaml
          test -f lib/main.dart

      - name: Resolve Dependencies
        working-directory: ${{ env.ZENA_BUILD_DIR }}
        run: flutter pub get

      - name: Show Native Asset Dependencies
        working-directory: ${{ env.ZENA_BUILD_DIR }}
        run: flutter pub deps

      - name: Analyze Dart
        working-directory: ${{ env.ZENA_BUILD_DIR }}
        run: flutter analyze
        continue-on-error: true

      - name: Run Flutter Tests
        working-directory: ${{ env.ZENA_BUILD_DIR }}
        shell: bash
        run: |
          if [ -d test ] && \
             find test -type f -name '*_test.dart' -print -quit | grep -q .; then
            flutter test
          else
            echo "No Dart tests found; skipping."
          fi
        continue-on-error: true

      - name: Build Release APK
        working-directory: ${{ env.ZENA_BUILD_DIR }}
        run: flutter build apk --release

      - name: Verify APK
        working-directory: ${{ env.ZENA_BUILD_DIR }}
        shell: bash
        run: |
          set -e
          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK tidak dijana."
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/Zena Bug.apk"
          ls -lh "$GITHUB_WORKSPACE/Zena Bug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zena Bug
          path: "Zena Bug.apk"
          if-no-files-found: error
          retention-days: 14
