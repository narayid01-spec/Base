
name: Build Zena Bug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Locate Flutter Project
        id: locate
        shell: bash
        run: |
          PROJECT_FILE="$(find . \
            -type f \
            -name pubspec.yaml \
            -not -path './.git/*' \
            -not -path './build/*' \
            -print -quit)"

          if [ -z "$PROJECT_FILE" ]; then
            echo "::error::Tiada pubspec.yaml ditemui."
            echo "Repository mesti mengandungi projek sumber Flutter."
            echo "APK sahaja tidak boleh digunakan untuk membina semula aplikasi Flutter."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"

          if [ ! -f "$PROJECT_DIR/lib/main.dart" ]; then
            echo "::error::lib/main.dart tiada dalam $PROJECT_DIR"
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Flutter project found: $PROJECT_DIR"

      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Android Configuration
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name zena_bug .
          fi

      - name: Get Dependencies
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: flutter pub get

      - name: Analyze Dart
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: flutter analyze
        continue-on-error: true

      - name: Run Tests
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          if [ -d test ] && find test -name '*_test.dart' -print -quit | grep -q .; then
            flutter test
          else
            echo "No Dart tests found; skipping."
          fi

      - name: Build Release APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: flutter build apk --release

      - name: Prepare APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/Zena Bug.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zena Bug
          path: "Zena Bug.apk"
          if-no-files-found: error
          retention-days: 14
