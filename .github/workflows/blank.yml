
name: Build Zena Bug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Zena Bug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Locate Flutter Project
        id: locate
        shell: bash
        run: |
          PROJECT_FILE=$(find "$GITHUB_WORKSPACE" \
            -type f -name pubspec.yaml \
            -not -path '*/.git/*' \
            -not -path '*/.dart_tool/*' \
            -not -path '*/build/*' \
            -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "::error::pubspec.yaml tidak ditemui."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          if [ ! -f "$PROJECT_DIR/lib/main.dart" ]; then
            echo "::error::lib/main.dart tidak ditemui."
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project: $PROJECT_DIR"

      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter
        run: flutter --version

      - name: Clean Generated Files
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          flutter clean
          rm -rf .dart_tool build
          rm -f .flutter-plugins-dependencies

      - name: Prepare Android
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name zena_bug .
          fi

      - name: Resolve Dependencies
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: flutter pub get

      - name: Analyze Dart
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: flutter analyze
        continue-on-error: true

      - name: Run Flutter Tests
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          if [ -d test ] && \
             find test -type f -name '*_test.dart' -print -quit | grep -q .; then
            flutter test
          else
            echo "Tiada fail ujian; langkah ini dilangkau."
          fi
        continue-on-error: true

      - name: Build Release APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: flutter build apk --release

      - name: Verify APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK tidak dijana atau fail kosong."
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/Zena Bug.apk"
          ls -lh "$GITHUB_WORKSPACE/Zena Bug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zena Bug
          path: "Zena Bug.apk"
          if-no-files-found: error
          retention-days: 14
