
name: Build Zena Bug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-backend:
    name: Test Admin Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r server/requirements.txt

      - name: Check Python syntax
        run: python -m py_compile server/app.py server/test_app.py

      - name: Run backend tests
        run: python -m unittest discover -s server -p 'test_*.py' -v

  build-android:
    name: Build Zena Bug APK
    runs-on: ubuntu-latest
    needs: test-backend

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter
        run: flutter doctor -v

      - name: Generate Android project
        run: flutter create --platforms=android --project-name zena_bug .

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze
        continue-on-error: true

      - name: Run Flutter tests
        run: flutter test

      - name: Build release APK
        env:
          ZENA_API_BASE: ${{ vars.ZENA_API_BASE }}
          ZENA_ADMIN_API_BASE: ${{ vars.ZENA_ADMIN_API_BASE }}
        shell: bash
        run: |
          args=()
          if [[ -n "$ZENA_API_BASE" ]]; then
            args+=("--dart-define=ZENA_API_BASE=$ZENA_API_BASE")
          fi
          if [[ -n "$ZENA_ADMIN_API_BASE" ]]; then
            args+=("--dart-define=ZENA_ADMIN_API_BASE=$ZENA_ADMIN_API_BASE")
          fi

          flutter build apk --release "${args[@]}"

          cp build/app/outputs/flutter-apk/app-release.apk \
            "Zena Bug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zena Bug APK
          path: "Zena Bug.apk"
          if-no-files-found: error
          retention-days: 14
